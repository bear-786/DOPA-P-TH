<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบทะเบียนราษฎร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EC;
    --paper-deep:#F1EADA;
    --ink:#1E2233;
    --ink-soft:#5B5A50;
    --line:#CBBE9E;
    --line-soft:#E4DAC0;
    --seal:#8A3B32;
    --seal-soft:#F1DFD6;
    --gold:#A07E2F;
    --ok:#3F6B4A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Sarabun',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;line-height:1.6;}
  #app{max-width:960px;margin:0 auto;padding:28px 20px 80px;}

  .letterhead{display:flex;align-items:center;gap:18px;padding-bottom:18px;border-bottom:3px double var(--line);margin-bottom:22px;}
  .seal{width:56px;height:56px;flex:none;}
  .seal svg{width:100%;height:100%;}
  .letterhead h1{font-family:'Chonburi',cursive;font-weight:400;font-size:26px;margin:0 0 2px;letter-spacing:.5px;}
  .letterhead p{margin:0;font-size:13.5px;color:var(--ink-soft);}

  .row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .muted{color:var(--ink-soft);font-size:13.5px;}
  .stat{font-family:'Chonburi',cursive;font-size:30px;color:var(--seal);line-height:1;}
  .stat-label{font-size:13px;color:var(--ink-soft);}

  input,button{font-family:'Sarabun',sans-serif;font-size:14.5px;}
  input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink);}
  input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
  .search{max-width:280px;}

  button{cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:3px;transition:opacity .15s ease;}
  button:hover{opacity:.85;}
  button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
  button.small{padding:5px 12px;font-size:13px;}

  .panel{background:var(--paper-deep);border:1px solid var(--line-soft);border-radius:4px;padding:22px;margin-bottom:26px;}
  .panel h2{font-size:17px;margin:0 0 16px;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:10px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:left;font-weight:600;color:var(--ink-soft);border-bottom:2px solid var(--ink);padding:8px;white-space:nowrap;}
  tbody td{padding:9px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
  tbody tr:hover{background:rgba(160,126,47,.06);}
  .idnum{font-variant-numeric:tabular-nums;letter-spacing:.4px;}
  .empty-row td{color:var(--ink-soft);text-align:center;padding:26px 8px;}
  .table-wrap{overflow-x:auto;}

  .overlay{position:fixed;inset:0;background:rgba(30,34,51,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10;}
  .msg{font-size:13px;padding:8px 10px;border-radius:3px;margin-bottom:14px;}
  .msg.err{background:var(--seal-soft);color:var(--seal);}

  /* ---- id card ---- */
  .card-wrap{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:26px;max-width:420px;width:100%;}
  .card-wrap .close-row{display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px;}
  .idcard{
    position:relative;overflow:hidden;
    border:1px solid var(--line);border-radius:8px;
    background:linear-gradient(155deg,#fff 0%,#fdfbf4 60%,var(--seal-soft) 130%);
    padding:18px 18px 16px;
  }
  .idcard::after{
    content:"";position:absolute;right:-30px;bottom:-30px;width:150px;height:150px;
    border:14px solid var(--gold);opacity:.08;border-radius:50%;
  }
  .idcard-head{display:flex;align-items:center;gap:8px;margin-bottom:14px;position:relative;}
  .idcard-head .mini-seal{width:26px;height:26px;flex:none;}
  .idcard-head .mini-seal svg{width:100%;height:100%;}
  .idcard-head b{font-size:14px;}
  .idcard-body{display:flex;gap:16px;position:relative;}
  .avatar{
    width:78px;height:96px;flex:none;border:1px solid var(--line);border-radius:4px;
    background:var(--paper-deep);display:flex;align-items:center;justify-content:center;
  }
  .avatar svg{width:44px;height:44px;color:var(--ink-soft);}
  .idcard-fields{flex:1;min-width:0;}
  .idcard-fields .name-line{font-size:17px;font-weight:600;margin-bottom:6px;}
  .idcard-fields dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:13px;}
  .idcard-fields dt{color:var(--ink-soft);white-space:nowrap;}
  .idcard-fields dd{margin:0;}
  .idcard-id{margin-top:12px;font-size:15px;font-weight:600;letter-spacing:.6px;position:relative;}

  .footer-note{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:30px;}

  @media print{
    body *{visibility:hidden;}
    .card-wrap, .card-wrap *{visibility:visible;}
    .card-wrap{position:fixed;top:10%;left:50%;transform:translateX(-50%);border:none;}
    .close-row{display:none;}
  }
</style>
</head>
<body>
<div id="app"><p class="muted">กำลังโหลดข้อมูล…</p></div>

<script>
(function(){
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQIMcyu-vPWnjoXfQC1pe-_GbadA0X4dv5LDZos60PkU-AUHk6JP1BUVlcA-GJKs0AHDznZq5Eud9EI/pub?output=csv";

  let headers = [];
  let rows = [];        // array of objects keyed by header
  let loaded = false;
  let loadErr = null;
  let search = "";
  let openCard = null;  // the row object currently shown in the ID card modal

  // ---------- CSV parsing (RFC4180-ish) ----------
  function parseCSV(text){
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for(let i=0;i<text.length;i++){
      const c = text[i], n = text[i+1];
      if(inQuotes){
        if(c === '"' && n === '"'){ field += '"'; i++; }
        else if(c === '"'){ inQuotes = false; }
        else field += c;
      } else {
        if(c === '"'){ inQuotes = true; }
        else if(c === ','){ row.push(field); field=""; }
        else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
        else if(c === '\r'){ /* skip */ }
        else field += c;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.length > 1 || (r.length===1 && r[0] !== ""));
  }

  function toObjects(matrix){
    if(matrix.length === 0) return {headers:[], rows:[]};
    // some sheets have a category-grouping row above the real header row
    // (e.g. "ข้อมูลบุคคล" spanning several merged columns) — pick whichever
    // of the first two rows is more fully populated as the real header row.
    const nonEmpty = r => r.filter(c => c.trim() !== "").length;
    let headerIdx = 0;
    if(matrix.length > 1 && nonEmpty(matrix[1]) > nonEmpty(matrix[0])) headerIdx = 1;
    const hdr = matrix[headerIdx].map(h => h.trim());
    const out = matrix.slice(headerIdx + 1).map(r => {
      const obj = {};
      hdr.forEach((h,i) => obj[h] = (r[i] !== undefined ? r[i] : "").trim());
      return obj;
    }).filter(o => Object.values(o).some(v => v !== ""));
    return {headers:hdr.filter(Boolean), rows:out};
  }

  async function load(){
    loaded = false; loadErr = null; render();
    try{
      const res = await fetch(CSV_URL, {cache:"no-store"});
      if(!res.ok) throw new Error("HTTP "+res.status);
      const text = await res.text();
      const parsed = toObjects(parseCSV(text));
      headers = parsed.headers;
      rows = parsed.rows;
    }catch(e){
      loadErr = "ไม่สามารถโหลดข้อมูลได้ กรุณาตรวจสอบว่าชีตถูกเผยแพร่แบบสาธารณะ (Publish to web) หรือลองรีเฟรชอีกครั้ง";
    }
    loaded = true;
    render();
  }

  // ---------- field detection helpers ----------
  function findHeader(patterns){
    return headers.find(h => patterns.some(p => h.toLowerCase().includes(p)));
  }
  function looksLikeId(v){
    return /^\d{10,13}$/.test((v||"").replace(/[^0-9]/g,""));
  }
  function formatId(v){
    const d = (v||"").replace(/[^0-9]/g,"");
    if(d.length !== 13) return v;
    return d.slice(0,1)+"-"+d.slice(1,5)+"-"+d.slice(5,10)+"-"+d.slice(10,12)+"-"+d.slice(12,13);
  }

  function buildName(row){
    const prefixH = findHeader(["คำนำหน้า","prefix"]);
    const firstH = findHeader(["ชื่อ","first"]) ;
    const lastH = findHeader(["นามสกุล","สกุล","last"]);
    const fullH = findHeader(["ชื่อ-สกุล","ชื่อเต็ม","fullname","full name"]);
    if(fullH && row[fullH]) return row[fullH];
    const parts = [prefixH && row[prefixH], firstH && row[firstH], lastH && row[lastH]].filter(Boolean);
    if(parts.length) return parts.join(" ");
    return null;
  }
  function buildIdField(row){
    let idH = findHeader(["เลขบัตร","เลขประจำตัวประชาชน","เลขประชาชน","idcard","id card","เลขที่บัตร"]);
    if(idH) return row[idH];
    idH = headers.find(h => looksLikeId(row[h]));
    return idH ? row[idH] : null;
  }
  function buildAddress(row){
    const keys = ["บ้านเลขที่","หมู่","ตำบล","แขวง","อำเภอ","เขต","จังหวัด","houseno","moo","tambon","amphoe","province","address","ที่อยู่"];
    const parts = headers.filter(h => keys.some(k => h.toLowerCase().includes(k)))
      .map(h => row[h]).filter(Boolean);
    return parts.length ? parts.join(" ") : null;
  }
  function buildBirth(row){
    const h = findHeader(["เกิด","birth"]);
    return h ? row[h] : null;
  }
  function buildPhoto(row){
    const h = findHeader(["รูปบัตร","รูปภาพ","รูปถ่าย","photo","image"]);
    const v = h ? row[h] : null;
    return v && /^https?:\/\//i.test(v) ? v : null;
  }

  // ---------- render ----------
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function sealSvg(size){
    return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'
      + '<circle cx="50" cy="50" r="46" fill="none" stroke="var(--gold)" stroke-width="2.5"/>'
      + '<circle cx="50" cy="50" r="37" fill="none" stroke="var(--seal)" stroke-width="1.2"/>'
      + '<polygon points="50,28 56,45 74,45 59,56 65,73 50,62 35,73 41,56 26,45 44,45" fill="var(--seal)" opacity="0.85"/>'
      + '</svg>';
  }
  function personSvg(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>';
  }

  function filteredRows(){
    if(!search.trim()) return rows;
    const q = search.trim().toLowerCase();
    return rows.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(q)));
  }

  function renderTable(){
    const list = filteredRows();
    const cols = headers.slice(0, 6); // keep the ledger compact
    let html = '<div class="table-wrap"><table><thead><tr><th>ลำดับ</th>'
      + cols.map(h=>'<th>'+esc(h)+'</th>').join('')
      + '<th></th></tr></thead><tbody>';
    if(list.length === 0){
      html += '<tr class="empty-row"><td colspan="'+(cols.length+2)+'">ไม่พบข้อมูล</td></tr>';
    } else {
      list.forEach((r,i)=>{
        html += '<tr>'
          + '<td>'+(i+1)+'</td>'
          + cols.map(h => '<td class="'+(looksLikeId(r[h])?'idnum':'')+'">'+esc(looksLikeId(r[h]) ? formatId(r[h]) : r[h])+'</td>').join('')
          + '<td><button class="secondary small" data-view="'+i+'">ดูบัตร</button></td>'
          + '</tr>';
      });
    }
    html += '</tbody></table></div>';
    return html;
  }

  function renderCardModal(row){
    const name = buildName(row) || "-";
    const idRaw = buildIdField(row);
    const birth = buildBirth(row);
    const addr = buildAddress(row);
    const photo = buildPhoto(row);
    const knownKeys = new Set();
    [findHeader(["คำนำหน้า","prefix"]), findHeader(["ชื่อ","first"]), findHeader(["นามสกุล","สกุล","last"]),
     findHeader(["ชื่อ-สกุล","ชื่อเต็ม","fullname","full name"]),
     findHeader(["เกิด","birth"]),
     findHeader(["ผู้บันทึก","บันทึกโดย","officer"]),
     findHeader(["รูปบัตร","รูปภาพ","รูปถ่าย","photo","image"])
    ].forEach(k=>k&&knownKeys.add(k));
    headers.filter(h => ["บ้านเลขที่","หมู่","ตำบล","แขวง","อำเภอ","เขต","จังหวัด","ที่อยู่"].some(k=>h.includes(k))).forEach(h=>knownKeys.add(h));
    if(idRaw !== null){ const idH = findHeader(["เลขบัตร","เลขประจำตัวประชาชน","เลขประชาชน","idcard","id card","เลขที่บัตร"]) || headers.find(h=>looksLikeId(row[h])); if(idH) knownKeys.add(idH); }

    const extraRows = headers.filter(h => !knownKeys.has(h) && row[h])
      .map(h => '<dt>'+esc(h)+'</dt><dd>'+esc(row[h])+'</dd>')
      .join('');

    return '<div class="overlay" data-close-overlay>'
      + '<div class="card-wrap" onclick="event.stopPropagation()">'
      + '<div class="close-row"><button class="secondary small" data-print>พิมพ์</button><button class="secondary small" data-close>ปิด</button></div>'
      + '<div class="idcard">'
        + '<div class="idcard-head"><div class="mini-seal">'+sealSvg()+'</div><b>บัตรประจำตัวราษฎร</b></div>'
        + '<div class="idcard-body">'
          + '<div class="avatar">'+(photo ? '<img src="'+esc(photo)+'" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:3px;">' : personSvg())+'</div>'
          + '<div class="idcard-fields">'
            + '<div class="name-line">'+esc(name)+'</div>'
            + '<dl>'
              + (birth ? '<dt>เกิด</dt><dd>'+esc(birth)+'</dd>' : '')
              + (addr ? '<dt>ที่อยู่</dt><dd>'+esc(addr)+'</dd>' : '')
              + extraRows
            + '</dl>'
            + (idRaw ? '<div class="idcard-id">'+esc(formatId(idRaw))+'</div>' : '')
          + '</div>'
        + '</div>'
      + '</div>'
      + '</div></div>';
  }

  function render(){
    const app = document.getElementById('app');
    const header = '<div class="letterhead"><div class="seal">'+sealSvg()+'</div><div>'
      + '<h1>ระบบทะเบียนราษฎร</h1>'
      + '<p>ทะเบียนกลางแห่งราชอาณาจักร &middot; สำหรับตรวจสอบข้อมูลและเรียกดูบัตรของตนเอง</p>'
      + '</div></div>';

    if(!loaded){ app.innerHTML = header + '<p class="muted">กำลังโหลดข้อมูล…</p>'; return; }

    let body = '';
    if(loadErr){
      body += '<div class="msg err">'+esc(loadErr)+'</div><button class="secondary" data-reload>ลองใหม่</button>';
    } else {
      body += '<div class="row" style="margin-bottom:20px;">'
        + '<div><span class="stat">'+rows.length+'</span> <span class="stat-label">ราย ขึ้นทะเบียนแล้ว</span></div>'
        + '<button class="secondary" data-reload>รีเฟรชข้อมูล</button>'
        + '</div>';
      body += '<div class="panel">'
        + '<h2>ค้นหาทะเบียนราษฎร</h2>'
        + '<div class="field search" style="margin-bottom:16px;"><input id="searchInput" placeholder="ค้นหาชื่อ นามสกุล หรือเลขบัตรประชาชน" value="'+esc(search)+'"></div>'
        + renderTable()
        + '</div>';
    }
    body += '<p class="footer-note">กดปุ่ม "ดูบัตร" ที่แถวของตนเองเพื่อเรียกดูบัตรประจำตัวแบบเต็ม</p>';

    app.innerHTML = header + body;

    if(openCard){
      const wrap = document.createElement('div');
      wrap.innerHTML = renderCardModal(openCard);
      app.appendChild(wrap.firstChild);
    }
    attach();
  }

  function attach(){
    const $ = s => document.querySelector(s);
    const si = $('#searchInput');
    if(si){
      si.addEventListener('input', e=>{
        search = e.target.value;
        render();
        const el = document.getElementById('searchInput');
        if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
      });
    }
    const reload = $('[data-reload]');
    if(reload) reload.addEventListener('click', load);

    document.querySelectorAll('[data-view]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = parseInt(btn.getAttribute('data-view'),10);
        openCard = filteredRows()[idx];
        render();
      });
    });
    const closeBtn = $('[data-close]');
    if(closeBtn) closeBtn.addEventListener('click', ()=>{ openCard = null; render(); });
    const overlay = $('[data-close-overlay]');
    if(overlay) overlay.addEventListener('click', ()=>{ openCard = null; render(); });
    const printBtn = $('[data-print]');
    if(printBtn) printBtn.addEventListener('click', ()=> window.print());
  }

  load();
})();
</script>
</body>
</html>
